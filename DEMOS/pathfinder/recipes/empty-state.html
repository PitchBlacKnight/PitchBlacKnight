<!-- RECIPE: Empty state pattern — no-results inside a real table shell, so the
     audience sees the pattern in context rather than floating on a blank page. -->
<div style="padding:40px;max-width:1000px;margin:0 auto;">
  <div class="pf-table-wrap">
    <div class="pf-table-toolbar">
      <span class="title">Partner Orders</span>
      <select class="pf-select" style="width:160px">
        <option>Cancelled</option>
      </select>
      <button class="pf-btn pf-btn-ghost">Clear filters</button>
    </div>

    <div style="padding:64px 24px;text-align:center;">
      <div style="font-size:40px;line-height:1;color:var(--pfContent_NonInteractiveIconColor);margin-bottom:18px;">○</div>
      <h4 style="margin-bottom:10px;">No cancelled orders</h4>
      <p style="color:var(--pfContent_LabelColor);max-width:380px;margin:0 auto 22px;">
        No orders match the current filter. Try widening the date range or
        clearing the status filter to see all 312 orders.
      </p>
      <div class="pf-row" style="justify-content:center;">
        <button class="pf-btn pf-btn-ghost">Clear filters</button>
        <button class="pf-btn pf-btn-primary" data-toast="Showing all orders|Filter cleared — 312 orders.|info">Show all orders</button>
      </div>
    </div>

    <div class="pf-table-footer">
      <span>Showing 0 of 312 orders</span>
    </div>
  </div>
</div>

<!-- universal nav: one tap back to the hub, on every page -->
